<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acefone · Interactions Hub</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;height:100%;background:#F7F8FB;font-family:var(--ace-font-sans);color:#051441;}
  #root{height:100vh;}
  @keyframes b { 0%,80%,100% { opacity:.2 } 40% { opacity:1 } }
  button { font-family: inherit; }
  *::-webkit-scrollbar { width:8px; height:8px; }
  *::-webkit-scrollbar-thumb { background:#DDE1EB; border-radius:999px; }
  *::-webkit-scrollbar-track { background: transparent; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Workspace.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  function App(){
    const [sel,setSel] = useState('jr');
    return (
      <div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#F1F3F9'}}>
        <Header/>
        <div style={{flex:1,display:'flex',minHeight:0,padding:12,gap:0}}>
          <div style={{flex:1,display:'flex',minHeight:0,background:'#fff',borderRadius:14,overflow:'hidden',boxShadow:'0 2px 6px rgba(5,20,65,.04)',border:'1px solid #EEF0F5'}}>
            <Rail/>
            <Inbox sel={sel} onSel={setSel}/>
            <Conversation/>
            <ContactPanel/>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
