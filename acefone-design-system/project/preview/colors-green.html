<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .row{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;}
  .sw{border-radius:10px;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:11px;line-height:1.2;box-shadow:var(--ace-shadow-xs);}
  .sw b{display:block;font-weight:600;margin-bottom:2px;}
  .sw code{font-family:var(--ace-font-mono);font-size:10px;opacity:.9;}
  .sw.dark{color:#051441;}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin:0 0 12px;}
  .sub{color:var(--ace-fg-muted);font-size:13px;margin:12px 0 0;}
</style></head><body>
  <div class="label">Green · accent ramp</div>
  <div class="row">
    <div class="sw dark" style="background:#E6F7ED"><b>50</b><code>#E6F7ED</code></div>
    <div class="sw dark" style="background:#BFEBD0"><b>100</b><code>#BFEBD0</code></div>
    <div class="sw dark" style="background:#80D6A1"><b>200</b><code>#80D6A1</code></div>
    <div class="sw" style="background:#33BE74"><b>300</b><code>#33BE74</code></div>
    <div class="sw" style="background:#00B060"><b>400 ·</b><code>#00B060</code></div>
    <div class="sw" style="background:#009C55"><b>500</b><code>#009C55</code></div>
    <div class="sw" style="background:#00894A"><b>600</b><code>#00894A</code></div>
    <div class="sw" style="background:#007540"><b>700</b><code>#007540</code></div>
    <div class="sw" style="background:#006235"><b>800</b><code>#006235</code></div>
  </div>
  <p class="sub">Use sparingly — success states, positive stats, confirmatory CTAs. Never a second "brand" color.</p>
</body></html>
