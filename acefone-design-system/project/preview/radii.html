<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:18px;}
  .row{display:flex;gap:22px;align-items:flex-end;}
  .item{text-align:center;}
  .box{background:var(--ace-blue-600);width:82px;height:82px;margin-bottom:10px;}
  .tok{font-family:var(--ace-font-mono);font-size:11px;color:var(--ace-blue-900);display:block;}
  .val{font-family:var(--ace-font-mono);font-size:10px;color:var(--ace-fg-muted);}
</style></head><body>
  <div class="eb">Radii</div>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="tok">xs</span><span class="val">4px</span></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><span class="tok">sm</span><span class="val">6px</span></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><span class="tok">md</span><span class="val">10px</span></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><span class="tok">lg</span><span class="val">14px</span></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><span class="tok">xl</span><span class="val">20px</span></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><span class="tok">2xl</span><span class="val">28px</span></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><span class="tok">pill</span><span class="val">999px</span></div>
  </div>
</body></html>
