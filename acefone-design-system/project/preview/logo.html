<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;height:100%;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-blue-950);}
  body{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  .pane{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;}
  .light{background:#fff;border-right:1px solid #EEF0F5;}
  .dark{background:#051441;color:#fff;}
  img{max-width:220px;height:auto;display:block;}
  .dark img{filter:brightness(0) invert(1);}
  .lbl{font-family:var(--ace-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;}
</style></head><body>
  <div class="pane light"><img src="../assets/logo.png" alt="Acefone"><div class="lbl">On light · primary</div></div>
  <div class="pane dark"><img src="../assets/logo.png" alt="Acefone"><div class="lbl">On dark · knockout</div></div>
</body></html>
