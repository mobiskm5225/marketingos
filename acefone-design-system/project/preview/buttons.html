<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:18px;}
  .row{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;border:none;cursor:pointer;transition:all .14s cubic-bezier(.2,.8,.2,1);text-decoration:none;}
  .btn.primary{background:linear-gradient(135deg,#1A4ADB,#1338A4);color:#fff;box-shadow:0 6px 16px rgba(5,20,65,.08);}
  .btn.primary:hover{box-shadow:0 18px 48px rgba(24,68,201,.32);transform:translateY(-2px);}
  .btn.secondary{background:#fff;color:#1338A4;border:1.5px solid #1338A4;}
  .btn.secondary:hover{background:#EEF3FE;}
  .btn.green{background:linear-gradient(135deg,#00B060,#007540);color:#fff;}
  .btn.ghost{background:transparent;color:#1338A4;}
  .btn.ghost:hover{background:#EEF3FE;}
  .btn.sm{padding:8px 14px;font-size:13px;border-radius:8px;}
  .btn.lg{padding:16px 28px;font-size:17px;border-radius:12px;}
  svg{width:18px;height:18px;}
</style></head><body>
  <div class="eb">Buttons</div>
  <div class="row">
    <button class="btn primary">Book a Demo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
    <button class="btn secondary">Talk to an Expert</button>
    <button class="btn green">Calculate Your Savings</button>
    <button class="btn ghost">Explore the Platform →</button>
  </div>
  <div class="row" style="margin-top:16px;">
    <button class="btn primary sm">Book a Demo</button>
    <button class="btn primary">Book a Demo</button>
    <button class="btn primary lg">Book a Demo</button>
  </div>
</body></html>
