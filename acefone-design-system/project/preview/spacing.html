<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:80px 1fr 80px;gap:16px 12px;align-items:center;}
  .tok{font-family:var(--ace-font-mono);font-size:12px;color:var(--ace-blue-900);}
  .bar{height:18px;background:var(--ace-blue-500);border-radius:4px;}
  .val{font-family:var(--ace-font-mono);font-size:12px;color:var(--ace-fg-muted);}
</style></head><body>
  <div class="eb">Spacing · 8-pt scale</div>
  <div class="grid">
    <span class="tok">space-1</span><div class="bar" style="width:4px"></div><span class="val">4px</span>
    <span class="tok">space-2</span><div class="bar" style="width:8px"></div><span class="val">8px</span>
    <span class="tok">space-3</span><div class="bar" style="width:12px"></div><span class="val">12px</span>
    <span class="tok">space-4</span><div class="bar" style="width:16px"></div><span class="val">16px</span>
    <span class="tok">space-6</span><div class="bar" style="width:24px"></div><span class="val">24px</span>
    <span class="tok">space-8</span><div class="bar" style="width:32px"></div><span class="val">32px</span>
    <span class="tok">space-12</span><div class="bar" style="width:48px"></div><span class="val">48px</span>
    <span class="tok">space-16</span><div class="bar" style="width:64px"></div><span class="val">64px</span>
    <span class="tok">space-24</span><div class="bar" style="width:96px"></div><span class="val">96px</span>
  </div>
</body></html>
