<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-blue-950);}
  body{padding:24px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .stat{font-size:76px;line-height:1;letter-spacing:-.02em;font-weight:700;color:var(--ace-blue-700);}
  .lbl{font-size:13px;color:var(--ace-fg-muted);margin-top:10px;max-width:200px;line-height:1.4;}
  .pct{color:var(--ace-green-600);}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:18px;}
</style></head><body>
  <div class="eb">Stat display</div>
  <div class="row">
    <div><div class="stat pct">70<span style="font-size:44px;">%</span></div><div class="lbl">Reduction in cost per call, post-deployment</div></div>
    <div><div class="stat">2.5<span style="font-size:44px;">B</span></div><div class="lbl">Customer engagements handled annually</div></div>
    <div><div class="stat">0.05<span style="font-size:44px;">s</span></div><div class="lbl">Voice streaming latency, end-to-end</div></div>
  </div>
</body></html>
