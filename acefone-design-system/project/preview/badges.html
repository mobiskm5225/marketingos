<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:18px;}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;}
  .dot{width:7px;height:7px;border-radius:999px;}
  .tag{font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;background:#EEF0F5;color:#373E56;}
  .tag.solid{background:#1844C9;color:#fff;}
  .tag.outline{background:#fff;border:1px solid #DDE1EB;}
</style></head><body>
  <div class="eb">Badges &amp; tags</div>
  <div class="row">
    <span class="badge" style="background:#E6F7ED;color:#00894A;"><span class="dot" style="background:#009C55;"></span>Live</span>
    <span class="badge" style="background:#EEF3FE;color:#1338A4;"><span class="dot" style="background:#1A4ADB;"></span>In queue</span>
    <span class="badge" style="background:#FEF5E1;color:#B47113;"><span class="dot" style="background:#F5A524;"></span>On hold</span>
    <span class="badge" style="background:#FDECEE;color:#B0353A;"><span class="dot" style="background:#E5484D;"></span>Missed</span>
    <span class="badge" style="background:#EEF0F5;color:#4D5570;">Draft</span>
  </div>
  <div class="row" style="margin-top:14px;">
    <span class="tag solid">Inbound</span>
    <span class="tag">VIP</span>
    <span class="tag">Tier-1</span>
    <span class="tag outline">Sales</span>
    <span class="tag outline">EN · IN</span>
  </div>
</body></html>
