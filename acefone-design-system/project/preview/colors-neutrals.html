<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;}
  .sw{border-radius:10px;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:11px;line-height:1.2;box-shadow:var(--ace-shadow-xs);border:1px solid rgba(5,20,65,.06);}
  .sw b{display:block;font-weight:600;margin-bottom:2px;}
  .sw code{font-family:var(--ace-font-mono);font-size:10px;opacity:.9;}
  .sw.dark{color:#051441;}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin:0 0 12px;}
</style></head><body>
  <div class="label">Neutrals · cool-biased gray ramp</div>
  <div class="row">
    <div class="sw dark" style="background:#FFFFFF"><b>white</b><code>#FFFFFF</code></div>
    <div class="sw dark" style="background:#F7F8FB"><b>50</b><code>#F7F8FB</code></div>
    <div class="sw dark" style="background:#EEF0F5"><b>100</b><code>#EEF0F5</code></div>
    <div class="sw dark" style="background:#DDE1EB"><b>200</b><code>#DDE1EB</code></div>
    <div class="sw dark" style="background:#C3C9D8"><b>300</b><code>#C3C9D8</code></div>
    <div class="sw" style="background:#9BA3B8"><b>400</b><code>#9BA3B8</code></div>
    <div class="sw" style="background:#6E7690"><b>500</b><code>#6E7690</code></div>
    <div class="sw" style="background:#4D5570"><b>600</b><code>#4D5570</code></div>
    <div class="sw" style="background:#373E56"><b>700</b><code>#373E56</code></div>
    <div class="sw" style="background:#0F1530"><b>900</b><code>#0F1530</code></div>
  </div>
</body></html>
