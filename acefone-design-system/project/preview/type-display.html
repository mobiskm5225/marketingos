<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);}
  body{padding:28px;color:var(--ace-blue-950);}
  .meta{font-size:11px;font-family:var(--ace-font-mono);color:var(--ace-fg-muted);margin-top:6px;letter-spacing:0;}
  h1.d{font-size:64px;line-height:1.05;letter-spacing:-.02em;font-weight:700;margin:0;}
  h2.d{font-size:44px;line-height:1.1;letter-spacing:-.01em;font-weight:600;margin:18px 0 0;color:var(--ace-blue-900);}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:10px;}
</style></head><body>
  <div class="eb">Display typography</div>
  <h1 class="d">Your customers are waiting.</h1>
  <div class="meta">H1 · Poppins Bold · 64px / 1.05 · −0.02em · #051441</div>
  <h2 class="d">They shouldn't have to.</h2>
  <div class="meta">H2 · Poppins Semibold · 44px / 1.1 · −0.01em · #0D2A7C</div>
</body></html>
