<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;}
  .sw{border-radius:10px;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:11px;line-height:1.2;box-shadow:var(--ace-shadow-xs);}
  .sw b{display:block;font-weight:600;margin-bottom:2px;}
  .sw code{font-family:var(--ace-font-mono);font-size:10px;opacity:.9;}
  .sw.dark{color:#051441;}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin:0 0 12px;}
</style></head><body>
  <div class="label">Blue · primary brand ramp</div>
  <div class="row">
    <div class="sw dark" style="background:#EEF3FE"><b>50</b><code>#EEF3FE</code></div>
    <div class="sw dark" style="background:#D6E0FB"><b>100</b><code>#D6E0FB</code></div>
    <div class="sw dark" style="background:#A8BCF5"><b>200</b><code>#A8BCF5</code></div>
    <div class="sw" style="background:#6E8BEC"><b>300</b><code>#6E8BEC</code></div>
    <div class="sw" style="background:#2454E5"><b>400</b><code>#2454E5</code></div>
    <div class="sw" style="background:#1A4ADB"><b>500</b><code>#1A4ADB</code></div>
    <div class="sw" style="background:#1844C9"><b>600 ·</b><code>#1844C9</code></div>
    <div class="sw" style="background:#153EB7"><b>700</b><code>#153EB7</code></div>
    <div class="sw" style="background:#1338A4"><b>800</b><code>#1338A4</code></div>
    <div class="sw" style="background:#051441"><b>950</b><code>#051441</code></div>
  </div>
</body></html>
