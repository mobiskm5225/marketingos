<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:24px;max-width:620px;}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:18px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:500;color:var(--ace-blue-950);margin-bottom:6px;}
  input,select{width:100%;padding:12px 14px;font-family:inherit;font-size:15px;border:1px solid #DDE1EB;border-radius:10px;background:#fff;color:var(--ace-blue-950);box-sizing:border-box;transition:all .14s;}
  input:focus,select:focus{outline:none;border-color:#1A4ADB;box-shadow:0 0 0 4px rgba(24,68,201,.22);}
  .help{font-size:12px;color:var(--ace-fg-muted);margin-top:6px;}
  .row2{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:stretch;}
  .row2 select{border-top-right-radius:0;border-bottom-right-radius:0;}
  .row2 input{border-top-left-radius:0;border-bottom-left-radius:0;border-left:none;}
</style></head><body>
  <div class="eb">Form inputs</div>
  <div class="field"><label>Work email</label><input placeholder="name@company.com"></div>
  <div class="field"><label>Phone number</label><div class="row2">
    <select><option>🇮🇳 India +91</option><option>🇺🇸 USA +1</option><option>🇬🇧 UK +44</option></select>
    <input placeholder="88 7777 1234"></div>
  </div>
  <div class="field"><label>How many agents?</label><select><option>1–10</option><option>10–50</option><option>50–200</option><option>200+</option></select></div>
</body></html>
