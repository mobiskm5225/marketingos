<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#F7F8FB;font-family:var(--ace-font-sans);color:var(--ace-fg);}
  body{padding:32px;}
  .eb{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ace-blue-600);margin-bottom:24px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;}
  .box{background:#fff;height:88px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;font-family:var(--ace-font-mono);font-size:11px;color:var(--ace-blue-900);}
</style></head><body>
  <div class="eb">Elevation · blue-tinted shadows</div>
  <div class="row">
    <div class="box" style="box-shadow:0 1px 2px rgba(5,20,65,.05);">xs</div>
    <div class="box" style="box-shadow:0 2px 6px rgba(5,20,65,.06),0 1px 2px rgba(5,20,65,.04);">sm</div>
    <div class="box" style="box-shadow:0 6px 16px rgba(5,20,65,.08),0 2px 4px rgba(5,20,65,.04);">md</div>
    <div class="box" style="box-shadow:0 16px 36px rgba(5,20,65,.12),0 4px 10px rgba(5,20,65,.06);">lg</div>
    <div class="box" style="box-shadow:0 28px 60px rgba(5,20,65,.18),0 8px 20px rgba(5,20,65,.08);">xl</div>
  </div>
</body></html>
