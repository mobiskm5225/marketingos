services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acefone
      POSTGRES_USER: acefone
      POSTGRES_PASSWORD: acefone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acefone -d acefone"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    volumes:
      - ./backend/src/core/db/migrations:/migrations:ro
    environment:
      PGPASSWORD: acefone
    command: >
      sh -c "
        until pg_isready -h postgres -U acefone -d acefone; do sleep 1; done &&
        for f in /migrations/*.sql; do
          echo \"Running $$f\" &&
          psql -h postgres -U acefone -d acefone -f $$f;
        done &&
        echo 'Migrations complete'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mi

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://acefone:acefone@postgres:5432/acefone
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - mi
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mi
    restart: unless-stopped

networks:
  mi:
    driver: bridge

volumes:
  pgdata:
